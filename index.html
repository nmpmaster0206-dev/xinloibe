<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Ngăn phóng to thu nhỏ trên điện thoại để nút chạy mượt hơn -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xin lỗi em 🥺</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Phối màu nền gradient lãng mạn hơn */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Tránh xuất hiện thanh cuộn khi nút chạy */
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            text-align: center;
            width: 85%;
            max-width: 350px;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #57606f;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            position: relative;
            height: 45px;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s; /* Tốc độ di chuyển của nút */
        }
        .btn-yes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            width: 120px;
        }
        .btn-yes:active {
            transform: scale(0.95);
        }
        .btn-no {
            background-color: #dfe4ea;
            color: #57606f;
            width: 120px;
            position: absolute;
            right: 0;
        }
        #success-screen {
            display: none;
        }
        .heart {
            font-size: 60px;
            animation: heartbeat 1s infinite;
        }
        /* Hiệu ứng tim đập */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Màn hình xin lỗi -->
    <div class="card" id="main-card">
        <h1>Bé ơi, anh xin lỗi! 🥺</h1>
        <p>Anh biết lỗi rồi. Lần này em tha lỗi cho anh nha?</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="acceptApology()">Tha lỗi ❤️</button>
            <button class="btn-no" id="btn-no">Không tha 😤</button>
        </div>
    </div>

    <!-- Màn hình thành công -->
    <div class="card" id="success-screen">
        <div class="heart">❤️</div>
        <h1>Yeayy! Cảm ơn em!</h1>
        <p>Anh biết ngay là em thương anh nhất mà. Yêu em nhiều lắm!</p>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');

        // Hàm tính toán vị trí ngẫu nhiên trên màn hình
        const moveButton = () => {
            // Trừ đi kích thước nút để không bị lọt ra ngoài màn hình
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        };

        // Trên máy tính: Di chuột vào là chạy
        btnNo.addEventListener('mouseover', moveButton);
        
        // Trên điện thoại: Vừa chạm ngón tay vào là chạy ngay lập tức
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Chặn hành động click
            moveButton();
        });

        // Hàm khi chọn nút Tha lỗi
        function acceptApology() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
        }
    </script>
</body>
</html>
